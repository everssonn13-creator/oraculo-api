<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b14">
  <title>Centris IA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
</head>
<body class="inicio">

  <!-- Barra superior (aparece durante a sessão) -->
  <header class="topo">
    <button class="marca" id="btn-inicio" title="Voltar ao início">
      <span class="cerebro mini" id="cerebro-mini" aria-hidden="true"></span>
      <span class="nome">Centris <b>IA</b></span>
    </button>
    <div class="acoes">
      <button class="icone" id="btn-base" title="Base de conhecimento" aria-label="Base de conhecimento">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      </button>
      <button class="icone" id="btn-nova" title="Nova análise" aria-label="Nova análise">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </header>

  <!-- Início: só o símbolo da IA -->
  <section class="tela-inicio" id="tela-inicio">
    <div class="palco-cerebro">
      <div class="cerebro grande" id="cerebro-grande" aria-label="Símbolo da IA: mapa do Brasil em rede neural"></div>
      <div class="sombra" aria-hidden="true"></div>
    </div>
    <p class="dica-mapa" id="dica-foco">Toque num estado para focar a análise</p>
    <p class="marca-inicio">CENTRIS <span>IA</span></p>
    <h1>O que o comercial precisa saber hoje?</h1>
    <div class="cards-inicio" id="cards-inicio">
      <button data-radar="1"><b>Radar de compras</b><small>Quem está comprando agora</small></button>
      <button data-p="Contas prioritárias para centrífugas e preparadores de polímero na região selecionada"><b>Contas prioritárias</b><small>Onde vender primeiro</small></button>
      <button data-p="Editais abertos para centrífugas, equipamentos de ETE/ETA e preparadores de polímero na região selecionada"><b>Editais abertos</b><small>Licitações em prazo</small></button>
      <button data-p="Concorrência e concessões na região selecionada: quem comprou, quem opera e próximas demandas"><b>Concorrência</b><small>Quem comprou e quem opera</small></button>
    </div>
  </section>

  <!-- Sessão: análises trazidas pela IA -->
  <section class="tela-sessao" id="tela-sessao">
    <nav class="trilha" id="trilha" aria-label="Análises desta sessão"></nav>
    <article class="analise" id="analise"></article>
  </section>

  <!-- Entrada -->
  <form class="entrada" id="form">
    <label class="foco" title="Foco geográfico">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      <select id="sel-foco" aria-label="Foco geográfico"></select>
    </label>
    <input id="pergunta" autocomplete="off" placeholder="Pergunte ao Centris IA…" aria-label="Pergunta">
    <button class="enviar" aria-label="Enviar">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </form>

  <!-- Base de conhecimento -->
  <aside class="gaveta" id="gaveta" aria-hidden="true">
    <div class="gaveta-cab">
      <h2>Base de conhecimento</h2>
      <button class="icone" id="fechar-gaveta" aria-label="Fechar">✕</button>
    </div>
    <p class="nota">Documentos adicionados aqui são consultados pela IA antes de cada análise.</p>
    <div id="aviso-persistencia"></div>
    <form id="form-doc" class="form-doc">
      <input name="titulo" placeholder="Título (ex.: SINISA 2024 — Nordeste)">
      <textarea name="texto" rows="5" placeholder="Cole um texto, tabela ou anotação…"></textarea>
      <label class="arquivo"><input type="file" name="arquivo" accept=".pdf,.txt,.md,.csv,.json"><span>Escolher arquivo (PDF, TXT, MD, CSV)</span></label>
      <input name="senha" type="password" placeholder="Senha de administrador" id="campo-senha" hidden>
      <button class="btn">Adicionar à base</button>
      <div id="doc-status" class="nota"></div>
    </form>
    <h3>Documentos</h3>
    <ul class="lista-docs" id="lista-docs"></ul>
  </aside>
  <div class="veu" id="veu"></div>

  <div class="tooltip" id="tooltip" role="tooltip"></div>
  <script src="app.js"></script>
</body>
</html>
